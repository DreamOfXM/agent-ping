name: Attach prebuilt binaries

# 补传预编译包的通道：把已经签好名、公证过、staple 完的包，替换到指定 Release 上。
#
# 存在的理由：往 Release 挂附件需要 contents:write，而本机可能只有只读的个人令牌
# （写操作返回 404），设备授权也可能被网络策略挡住。仓库自己的 GITHUB_TOKEN 有
# 写权限（tag 发版那次就是它建的 Release），而推分支只需要 SSH —— 于是让 runner
# 拿 GITHUB_TOKEN 去换附件。
#
# 用法：从 main 切一个 release-assets 分支，把产物放在 dist/，在 dist/RELEASE_TAG
# 里写上目标 tag（如 v0.1.3），推分支即可。跑完把分支删掉。
on:
  push:
    branches:
      - release-assets

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the target release tag
        run: |
          set -euo pipefail
          if [ ! -f dist/RELEASE_TAG ]; then
            echo "缺少 dist/RELEASE_TAG，不知道要挂到哪个 Release 上"
            exit 1
          fi
          tag=$(tr -d '[:space:]' < dist/RELEASE_TAG)
          echo "目标 Release：$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # 摘要不写死在 workflow 里：每次发版的产物都不同，写死就得跟着改。
      # 这里只证明「传上去的字节 == 工作区里的字节」，其余靠下载回算。
      - name: Fingerprint the binaries being shipped
        run: |
          set -euo pipefail
          sha256sum dist/Agent-Ping-macos-*.zip | tee /tmp/local.sha256

      - name: Replace the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 先删后传：GitHub 不接受同名重复上传，且历史上还有带 v0.1.3 前缀的
          # 重复命名，一并清掉。
          for name in \
            Agent-Ping-macos-arm64.zip \
            Agent-Ping-macos-x86_64.zip \
            "Agent-Ping-${TAG}-macos-arm64.zip" \
            "Agent-Ping-${TAG}-macos-x86_64.zip"
          do
            gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" \
              && echo "已删除旧附件 $name" || echo "无需删除 $name"
          done
          gh release upload "$TAG" \
            dist/Agent-Ping-macos-arm64.zip \
            dist/Agent-Ping-macos-x86_64.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Read back what GitHub stored, and download it again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'

          # 附件传上去不等于别人下得下来：从公开地址再取一遍，逐字节比对。
          while read -r want file; do
            name=$(basename "$file")
            curl -sSL --retry 3 -o "/tmp/$name" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
            got=$(sha256sum "/tmp/$name" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "下载回来的 $name 摘要不符：$got != $want"
              exit 1
            fi
            echo "公开下载校验通过：$name  $got"
          done < /tmp/local.sha256
