name: Build macOS app and attach to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    # macos-14 已被上游标记 deprecation（actions/runner-images#13518），
    # macos-26 是当前稳定的 arm64 镜像，也就是 macos-latest 指的那一个。
    runs-on: macos-26
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Install build dependencies
        run: brew install cmake ninja glfw freetype

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build --target pin_imgui_shell --parallel

      - name: Bundle app
        run: |
          sh Tools/make_bundle.sh
          mv "build/AgentPing-cpp.app" "build/Agent Ping.app"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/Agent Ping.app" \
            "Agent-Ping-${TAG}-macos-arm64.zip"
          # 稳定文件名：cask 用 version :latest 指它，这样每次发版都不用改 cask 里的
          # url 和 sha256。版本化的那份留给想固定版本的人。
          cp "Agent-Ping-${TAG}-macos-arm64.zip" "Agent-Ping-macos-arm64.zip"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "Agent-Ping-${TAG}-macos-arm64.zip" \
            "Agent-Ping-macos-arm64.zip" --clobber
