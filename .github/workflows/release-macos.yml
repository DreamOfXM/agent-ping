name: Build macOS app and attach to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (e.g. v0.1.2)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    # 两个架构各出一份，cask 才能对 Apple 芯片和 Intel 都成立。
    #
    # macos-26        → arm64，标准 runner，公开仓库免费
    # macos-26-intel  → x64，也是标准 runner（不是 -large，不需要付费计划）
    #
    # 注意 Intel 那台会慢很多：Homebrew 自 2026-09 起不再为 macOS Intel 出
    # bottle，所以 brew install 那几个依赖是现场编译的。arm64 那边是现成 bottle。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install cmake ninja glfw freetype

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build --target pin_imgui_shell --parallel

      - name: Bundle app
        run: |
          sh Tools/make_bundle.sh
          mv "build/AgentPing-cpp.app" "build/Agent Ping.app"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/Agent Ping.app" \
            "Agent-Ping-${TAG}-macos-${{ matrix.arch }}.zip"
          # 稳定文件名：cask 用 version :latest 指它，这样每次发版都不用改 cask 里的
          # url 和 sha256。版本化的那份留给想固定版本的人。
          cp "Agent-Ping-${TAG}-macos-${{ matrix.arch }}.zip" \
             "Agent-Ping-macos-${{ matrix.arch }}.zip"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "Agent-Ping-${TAG}-macos-${{ matrix.arch }}.zip" \
            "Agent-Ping-macos-${{ matrix.arch }}.zip" --clobber
