<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Ping · 多会话首页 03 · 2026-11-13</title>
<link rel="icon" href="assets/agent-ping.png"><link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
<symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 3 3-1 2 4 3-1 1-3 3-1 2-3-2-2 1-3-3-3-3 1-2-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="layers" viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5-9-5Zm0 4 9 5 9-5M3 16l9 5 9-5"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M21 11a9 9 0 0 1-9 9H3l2-5a9 9 0 1 1 16-4Z"/><path d="M8 10h8M8 14h5"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
<symbol id="branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 7v10M18 7c0 7-12 3-12 9"/></symbol>
</defs></svg>
<header class="preview-header"><div><div class="preview-title"><img src="assets/agent-ping.png" alt=""><strong>Agent Ping</strong><span>/</span>多会话首页 <b>03 · 2026-11-13</b></div><p>每条会话都是入口，不再先选中、再打开。</p></div><div class="preview-actions"><div class="switch"><button id="single" aria-pressed="true">新首页</button><button id="compare" aria-pressed="false">与原版对照</button></div><button id="reset">重置演示</button></div></header>
<div class="scenario-bar"><span>运行场景</span><div class="switch" role="group" aria-label="运行会话测试场景"><button data-scenario="1" aria-pressed="false">原样例 · 1 条</button><button data-scenario="3" aria-pressed="true">3 条运行</button><button data-scenario="6" aria-pressed="false">6 条运行</button></div><small>多条场景含新增测试会话，无虚构用量。</small></div>
<main class="stage" id="stage">
<section class="before"><div class="caption"><span>当前原生版 · 1 条运行</span><span>416 × 850</span></div><button id="baseline" aria-label="放大原版截图"><img src="assets/sessions-zh.png" alt="当前原生版首页，原始单运行会话样例"></button></section>
<section class="after"><div class="caption"><span id="preview-caption">新首页 · 3 条运行</span><span>416 × 850</span></div>
<div class="app" id="app">
<header class="app-header"><img src="assets/agent-ping.png" alt=""><strong>Agent Ping</strong><span class="sample">样例</span><button id="search-toggle" class="icon-button" aria-label="搜索会话" aria-expanded="false"><svg><use href="#search"/></svg></button><button id="settings" class="icon-button" aria-label="设置"><svg><use href="#gear"/></svg></button></header>
<div class="tool-dock" id="tools" aria-label="筛选工具" role="group"></div>
<div id="search-wrap" class="search-wrap" hidden><svg><use href="#search"/></svg><input id="search-input" type="search" placeholder="搜索项目、任务或请求" aria-label="搜索项目、任务或请求"><button id="search-close" class="icon-button" aria-label="关闭搜索"><svg><use href="#close"/></svg></button></div>
<nav class="app-tabs" aria-label="页面"><button id="session-tab" aria-current="page">会话 <span id="session-count">17</span></button><button id="usage-tab">用量与额度</button><button id="claims-tab">权益 <span>2</span></button></nav>
<div class="workspace" id="workspace" tabindex="0" aria-label="会话与额度"><div id="sessions"></div><section id="quotas" class="quota-panel" aria-label="额度仪表"></section></div>
<footer class="app-footer"><button id="history"><svg><use href="#check"/></svg><span>今日完成 <strong id="done-count">9</strong></span><span id="timeline" class="timeline" aria-hidden="true"></span><svg class="chevron"><use href="#chevron"/></svg></button></footer>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden><header><button id="sheet-back" class="back-button"><svg><use href="#back"/></svg>返回首页</button><h2 id="sheet-title"></h2></header><div id="sheet-body" class="sheet-body"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
</div></section>
</main>
<footer class="preview-footer"><p>点击会话直接触发打开；右侧展开按钮只查看详情。</p><p>独立交互预览，不连接真实会话 · 原版为 23:35 样例快照 · 用量与权益内页保留原生截图</p></footer>
<dialog id="zoom"><button id="zoom-close">关闭大图</button><img src="assets/sessions-zh.png" alt="原版首页放大图"></dialog>
<script src="app.js"></script>
</body></html>
